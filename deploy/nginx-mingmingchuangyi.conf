# ============================================================
# Ddayup 生产部署 - Nginx 配置 (mingmingchuangyi.cn)
# 用法: scp 到服务器 /etc/nginx/sites-enabled/ 后 nginx -t && systemctl reload nginx
# 后端对外端口说明: hmdao-api.mjs 实际监听 8792,
#   3000 是 ui-static-proxy(静态 app/dist + 反代 /api 到 8792)。
#   本配置统一反代到 3000(对外入口); 若你直接只起 8792, 把下面两处 3000 改 8792。
# ============================================================

server {
    listen 443 ssl http2;
    server_name mingmingchuangyi.cn www.mingmingchuangyi.cn;

    # 证书路径按你实际申请的改 (腾讯云免费 SSL 或 Let's Encrypt)
    ssl_certificate     /etc/nginx/ssl/mingmingchuangyi.cn/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/mingmingchuangyi.cn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 50m;

    # 全部请求转发到本地后端入口(3000 = 静态 + /api 反代)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name mingmingchuangyi.cn www.mingmingchuangyi.cn;
    # HTTP 强制跳 HTTPS (微信/支付宝要求 https 回调)
    return 301 https://$host$request_uri;
}
