# Ddayup / HMDAODAO 生产站点配置（Ubuntu + Nginx）
# 反代 /api/ -> 本机 8792（正式后端 ddayup-backend）
# certbot --nginx 申请证书后会自动追加 443 server 块与重定向
server {
    listen 80;
    server_name mingmingchuangyi.cn www.mingmingchuangyi.cn;

    root /var/www/hmdao;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/xhtml+xml image/svg+xml font/ttf font/opentype;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket 反代（目录同步 / 工作流 / DCC 实时通道）。
    # 缺失此段会导致 wss://mingmingchuangyi.cn/ws/catalog 落到 SPA location 返回 HTML，
    # 浏览器 WebSocket 升级失败（"WebSocket connection ... failed"）。
    location /ws/ {
        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 实时通道需长连接，避免被反代超时掐断。
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;
    }
}
