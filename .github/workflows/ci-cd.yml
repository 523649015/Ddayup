# HMDao CI/CD 流水线 — GitHub Actions 构建/测试/部署
#
# Phase 7 S4: 自动化构建、类型检查、lint、测试、部署
#
# 触发条件：
# - push 到 main/master 分支
# - PR 到 main/master 分支
# - 手动触发 (workflow_dispatch)
#
# 流水线阶段：
# 1. 类型检查 (tsc --noEmit)
# 2. Lint (eslint)
# 3. 单元测试 (vitest)
# 4. E2E 测试 (playwright)
# 5. 构建 (vite build)
# 6. 部署到 Azure Static Web Apps (仅 main 分支)

name: HMDao CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 并发控制 — 同一分支的新运行会取消旧运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===== Job 1: 类型检查 + Lint =====
  typecheck-and-lint:
    name: TypeScript 类型检查 + ESLint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: ESLint 检查
        run: npm run lint

  # ===== Job 2: 单元测试 =====
  unit-tests:
    name: Vitest 单元测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 运行单元测试
        run: npx vitest run --reporter=verbose

  # ===== Job 3: E2E 测试 =====
  e2e-tests:
    name: Playwright E2E 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      - name: 启动开发服务器
        run: npm run dev -- --host 0.0.0.0 &

      - name: 等待服务器就绪
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: 运行 E2E 测试
        run: npx playwright test --reporter=html

      - name: 上传 Playwright 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  # ===== Job 4: 构建 =====
  build:
    name: Vite 生产构建
    runs-on: ubuntu-latest
    needs: [typecheck-and-lint, unit-tests]
    defaults:
      run:
        working-directory: app
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: app/dist/
          retention-days: 7

  # ===== Job 5: 部署到 Azure Static Web Apps =====
  deploy:
    name: 部署到 Azure
    runs-on: ubuntu-latest
    needs: [build, e2e-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: app/dist/

      - name: 部署到 Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'app'
          output_location: 'dist'
          skip_app_build: true
